name: 定时抓取开奖数据

on:
  schedule:
    # 每天北京时间 22:00 和 22:30 各跑一次（开奖后）
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:  # 也可以手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip install requests
      
      - name: 运行抓取脚本
        run: python fetch.py
      
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "自动更新开奖数据 $(date +'%Y-%m-%d %H:%M')"
          git push
